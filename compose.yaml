services:
  db:
    image: mysql:8.0
    container_name: airbnb-db
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - airbnb_db_data:/var/lib/mysql
      - ./db_airbnb.sql:/docker-entrypoint-initdb.d/01-db_airbnb.sql:ro

volumes:
  airbnb_db_data:
